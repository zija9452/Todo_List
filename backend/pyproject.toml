[tool.poetry]
name = "todo-backend"
version = "0.1.0"
description = "Backend for the Full-Stack Todo Application"
authors = ["Developer <developer@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
sqlmodel = "^0.0.14"
pydantic = "^2.5.0"
pyjwt = "^2.8.0"
python-multipart = "^0.0.6"
uvicorn = "^0.24.0"
alembic = "^1.13.1"
asyncpg = "^0.29.0"
python-dotenv = "^1.0.0"
better-exceptions = "^0.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.2"
black = "^23.11.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"